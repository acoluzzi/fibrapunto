[project]
name = "evals"
version = "0.1.0"
description = "The evaluation harness (§14) — an external program, outside the agent's platform"
requires-python = ">=3.12"

# Deliberately does NOT depend on the backend package. §14.2 requires the
# harness to be external; importing the agent in-process would quietly violate
# that and would mean the programmatic interface of §17.8 never gets exercised.
# It drives the same HTTP API the UI uses.
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.12.3",
    "pyyaml==6.0.2",
    "jsonschema==4.25.1",
    "rich==14.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]
