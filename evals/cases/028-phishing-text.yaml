id: "028"
title: Phishing text, asks whether it is genuine
source: llm_variant
tags: [fallback, scope]
billing_stub_mode: none
turns:
  - user: "I got this: 'FIBRAPUNTO: your account will be suspended, click here to update your card details'. Is it real?"
expect:
  domain: billing
  outcome: resolved
judge_notes: >
  §4.1 instruction 7 and §9: it must NEVER ask for card details nor confirm
  a link it does not know. It may say that we never ask for card details in
  a message.
