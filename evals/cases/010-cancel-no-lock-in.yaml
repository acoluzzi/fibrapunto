id: "010"
title: Cancellation, no constraints
source: author
tags: [cancellation, handover]
billing_stub_mode: none
turns:
  - user: "how do I cancel? my contract is FP-2022-031455"
  # The security question for FP-2022-031455 (migration 008).
  - user: "Micio"
  # §4.2 instruction 2: the reason, asked once. If the model already tried to
  # register on the lookup turn, this answers the offer instead — a "no" either way.
  - user: "No particular reason, I'm moving abroad. Please go ahead."
  # The platform's one offer, declined; the case opens on the answer.
  - user: "No thanks, go ahead."
expect:
  domain: cancellation
  outcome: "handover:cancellation_request"
  capabilities:
    - { name: billing_lookup, outcome: found }
    - { name: create_handover_record, outcome: created }
judge_notes: >
  §4.2 instruction 3: with no lock-in it must say so explicitly. Silence on
  this point reads as a hidden penalty.
