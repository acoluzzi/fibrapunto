id: "009"
title: Cancelling after moving house
source: author
tags: [cancellation, handover]
billing_stub_mode: none
turns:
  - user: "I want to close my contract, I've moved house"
  - user: "FP-2024-092003"
  # The security question for FP-2024-092003 (migration 008).
  - user: "Torino"
expect:
  domain: cancellation
  outcome: "handover:cancellation_request"
  capabilities:
    - { name: billing_lookup, outcome: found }
    - { name: create_handover_record, outcome: created }
