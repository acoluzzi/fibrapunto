id: "005"
title: Billing is not responding
source: author
tags: [billing, failure, no_invention]
billing_stub_mode: timeout
turns:
  - user: "payment refused, contract FP-2023-048812, how much do I owe?"
  # The security question for FP-2023-048812 (migration 008).
  - user: "Torino"
