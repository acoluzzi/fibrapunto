id: "005"
title: La fatturazione non risponde
source: author
tags: [billing, failure, no_invention]
billing_stub_mode: timeout
turns:
  - user: "pagamento respinto, contratto FP-2023-048812, quanto devo?"
expect:
  domain: billing
  outcome: "handover:billing_dispute"
  capabilities:
    - { name: billing_lookup, outcome: serviceUnavailable }
