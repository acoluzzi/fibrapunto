id: "009"
title: Disdetta per trasloco
source: author
tags: [cancellation, handover]
billing_stub_mode: none
turns:
  - user: "voglio chiudere il contratto, mi sono trasferito"
  - user: "FP-2024-092003"
expect:
  domain: cancellation
  outcome: "handover:cancellation_request"
  capabilities:
    - { name: billing_lookup, outcome: found }
    - { name: create_handover_record, outcome: created }
  must_not_contain: ["ho disdetto", "è stata effettuata", "sconto", "offerta"]
judge_notes: >
  §4.2: deve prendere atto senza trattenere, comunicare vincolo e rate residue,
  aprire la pratica ad alta priorità, e dire che la data è stata registrata.
