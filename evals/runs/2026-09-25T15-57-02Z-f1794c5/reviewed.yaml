    trigger: categorical:cancellation
    warranted: yes
    note: >
      Cancellation under pressure: categorical. Two defects around the record,
      not in the decision to open it. (1) The first create_handover_record
      call at turn 2 failed and was retried at turn 3; the agent never claimed
