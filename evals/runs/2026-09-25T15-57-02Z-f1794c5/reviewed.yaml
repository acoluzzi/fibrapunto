      the request date legal weight, so this wording must be fixed even though
      the record's own timestamp is presumably correct.

  - case_id: '018'
    handover_reference: '00001051'
    trigger: conditional:no_progress
    warranted: yes
    note: >
      Refund demanded four times: categorical, warranted from turn 1. Two
      problems. (1) Late: the agent held the record hostage to a yes/no
      confirmation across turns 3-5 while sentiment went frustrated then
      angry. The no_progress trigger fired at turns 4 and 5 but was parked as
      read_back_pending; §12.1 says distress brings the offer forward, and
      the turn budget exists precisely so this does not run on. The record
      should have opened by turn 4 at the latest. (2) Misattributed: the
      record carries trigger conditional:no_progress, but the reason the
      customer needs a person is a refund request. The operator reading §12.2's
      trigger field sees "going in circles" instead of "refund"; the
      categorical trigger should win when both are pending.

