name: fibrapunto

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fibrapunto}
      POSTGRES_USER: ${POSTGRES_USER:-fibrapunto_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-owner}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Named user and database: the default healthcheck checks the wrong ones
      # and reports healthy while the database is still starting.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fibrapunto_owner} -d ${POSTGRES_DB:-fibrapunto}"]
      interval: 2s
      timeout: 3s
      retries: 20

  billing:
    build:
      context: .
      dockerfile: mock-billing/Dockerfile
    environment:
      BILLING_BASE_LATENCY_MS: ${BILLING_BASE_LATENCY_MS:-800}
      BILLING_LATENCY_JITTER_MS: ${BILLING_LATENCY_JITTER_MS:-300}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/_control/health')\""]
      interval: 3s
      timeout: 3s
      retries: 10

  # Retention and upsell offers, with a discount budget. A separate system from
  # billing and the CRM; the agent asks it, never invents an offer.
  recommendations:
    build:
      context: .
      dockerfile: recommendation-system/Dockerfile
    environment:
      RECOMMENDATIONS_BUDGET_EUR: ${RECOMMENDATIONS_BUDGET_EUR:-120}
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8082/_control/health')\""]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      BILLING_BASE_URL: http://billing:8081
      RECOMMENDATION_BASE_URL: http://recommendations:8082
    volumes:
      # §17.7: the credential store is external to the automation, so it is not
      # baked into the image. Read-only on purpose — the agent resolves a handle
      # at request time and never writes; rotation is `make rotate-credential`,
      # run by an operator on the host. A running agent that could rewrite its
      # own credential store would be a strange thing to have built.
      #
      # Missing this mount meant every billing lookup in the container failed
      # with CredentialNotFound, which the typed-outcome layer correctly turned
      # into `serviceUnavailable` — so the agent behaved perfectly and the demo
      # was broken. See docs/FRICTION-LOG.md.
      - ./secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      billing:
        condition: service_healthy
      recommendations:
        condition: service_healthy

  frontend:
    build:
      context: frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  db-data:
