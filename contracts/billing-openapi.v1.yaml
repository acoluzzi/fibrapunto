info:
  description: 'Interface to Fibrapunto''s legacy billing system.


    It is the system of record for payments; the customer record for a contract lives in the CRM, which
    is a different system. The two may be out of step: a contract present in the CRM may not exist here.'
  title: Fibrapunto — billing system (legacy)
  version: 1.0.0
openapi: 3.1.0
