server {
  listen 80;
  root /usr/share/nginx/html;

  # Single-page app: /operatore is routed client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API, so the app never needs to know where the backend lives
  # and there is no CORS in the demo path.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;

    # The trace is Server-Sent Events: buffering it would hold the whole
    # conversation back and then deliver it in one lump, which is exactly the
    # interleaving the panel exists to show.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}
