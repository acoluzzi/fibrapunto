[project]
name = "recommendation-system"
version = "0.1.0"
description = "Retention and upsell offers, with a spending budget — a separate system from billing and the CRM"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.120.4",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.3",
    "pydantic-settings==2.11.0",
    "pyyaml==6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recommendation_system"]
